name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  PIP_CONSTRAINT: /tmp/pip-constraints.txt
  # Clang moderno (NDK 25b incluido) trata como error fatal el uso de
  # funciones no declaradas (ej. setgrent/getgrent/endgrent del modulo
  # grp de CPython) en modo C99. python-for-android aun no trae un
  # parche para esto, asi que se baja a advertencia explicitamente.
  CFLAGS: -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Pin pip to a known-stable version
        run: echo "pip==24.3.1" > /tmp/pip-constraints.txt

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake libgl1-mesa-dev libgles2-mesa-dev mesa-common-dev

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.36

      - name: Pre-download freetype (evita servidor inestable de savannah.gnu.org)
        run: |
          mkdir -p .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          cd .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          curl -L "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz/download" -o freetype-2.14.1.tar.gz
          touch .mark-freetype-2.14.1.tar.gz
          ls -la

      - name: Build APK
        run: |
          success=false
          for i in 1 2 3 4 5; do
            find .buildozer -type d -name venv -exec rm -rf {} + 2>/dev/null || true
            if yes | buildozer android debug; then
              success=true
              break
            fi
            echo "Intento $i fallo, esperando 45 segundos antes de reintentar..."
            sleep 45
          done
          if [ "$success" = false ]; then
            echo "Todos los intentos de compilar fallaron"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hydrosmart-apk
          path: bin/*.apk
